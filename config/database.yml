# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV["DB_PORT"] %>
  username: <%= ENV["DB_USER"] %>
  password: <%= ENV["DB_PASSWORD"] %>


development:
  <<: *default
  database: <%= ENV["DB_NAME"] %>
  cache:
    database: <%= ENV["DB_NAME"] %>_cache

test:
  <<: *default
  database: <%= ENV["DB_NAME"] %>_test

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV["DB_NAME"] %>_production
    username: reviews_api
    password: <%= ENV["DB_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: <%= ENV["DB_NAME"] %>_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: reviews_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: reviews_api_production_cable
    migrations_paths: db/cable_migrate
